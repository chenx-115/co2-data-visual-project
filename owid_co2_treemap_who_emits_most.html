<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who emits the most CO2?</title>
  <style>
    :root {
      --ink: #355070;
      --muted: #6f6f6f;
      --line: #e6dfd3;
      --owid-navy: #0b2b4c;
      --owid-red: #d74c3c;
      --gap: 6px;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fbfaf7;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      max-width: 1280px;
      margin: 10px auto;
      padding: 14px 16px 10px;
      background: var(--bg);
    }

    .header {
      position: relative;
      min-height: 112px;
      padding-right: 128px;
      margin-bottom: 8px;
    }

    .owid-badge {
      position: absolute;
      top: 0;
      right: 0;
      width: 106px;
      padding: 10px 10px 12px;
      background: var(--owid-navy);
      color: #fff;
      border-bottom: 5px solid var(--owid-red);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      color: #385678;
      font-size: 58px;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 820px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 27px);
      line-height: 1.12;
    }

    .chart-frame {
      background: #fff;
      overflow: visible;
    }

    .layout {
      display: grid;
      grid-template-columns: 55fr 45fr;
      gap: var(--gap);
      min-height: 790px;
      background: #fff;
      overflow: visible;
    }

    .left-side {
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    .layout > .region-card,
    .layout > .right-side {
      height: 100%;
      min-height: 0;
    }

    .region-card {
      min-width: 0;
      min-height: 0;
      display: grid;
    }

    .region-card.top {
      grid-template-rows: auto 1fr;
    }

    .right-side {
      min-width: 0;
      display: grid;
      grid-template-rows: 62fr 38fr;
      gap: var(--gap);
      overflow: visible;
    }

    .right-top {
      min-width: 0;
      display: grid;
      grid-template-columns: 58fr 42fr;
      gap: var(--gap);
    }

    .right-bottom-wrap {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 0;
      overflow: visible;
      margin-bottom: 58px;
    }

    .right-bottom {
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 41fr 29fr 12fr 18fr;
      gap: var(--gap);
    }

    .right-bottom .region-card {
      height: 100%;
      min-height: 0;
    }

    .international-card {
      display: block;
      height: 100%;
      min-height: 0;
    }

    .panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #panel-asia {
      height: 100%;
    }

    .chart-box {
      position: absolute;
      inset: 0;
    }

    .region-header {
      padding: 0 2px 6px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .right-bottom-captions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: 41fr 29fr 12fr 18fr;
      gap: var(--gap);
      pointer-events: none;
    }

    .right-bottom-captions .region-header {
      padding: 0 2px;
      text-align: center;
    }

    .region-header strong {
      display: block;
      font-size: 27px;
      line-height: 0.92;
      font-weight: 400;
      margin-bottom: 1px;
      letter-spacing: -0.02em;
    }

    .region-header span {
      display: block;
      font-size: 16px;
      line-height: 1.06;
      font-weight: 400;
    }

    .right-bottom-captions .region-header strong {
      font-size: 17px;
    }

    .right-bottom-captions .region-header span {
      font-size: 12px;
      line-height: 1.08;
    }

    .region-asia { color: #ef3a2f; }
    .region-north-america { color: #14a05a; }
    .region-europe { color: #ffb71c; }
    .region-africa { color: #2c79bf; }
    .region-south-america { color: #9acd65; }
    .region-oceania { color: #7b57b4; }

    .status {
      display: none;
    }

    .notes {
      margin-top: 10px;
      color: #757575;
      font-size: 12px;
      line-height: 1.35;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .notes p {
      margin: 0 0 5px;
    }

    .notes a {
      color: #4f6785;
    }

    .panel-caption {
      display: none;
      position: absolute;
      inset: auto 8px 8px 8px;
      z-index: 3;
      color: #8a8a8a;
      text-align: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      pointer-events: none;
    }

    .panel-caption strong {
      display: block;
      font-size: 13px;
      line-height: 1.05;
      font-weight: 400;
    }

    .panel-caption span {
      display: block;
      font-size: 11px;
      line-height: 1.1;
    }

    #panel-international {
      min-width: 96px;
      height: 100%;
      background: #9a9a9a;
    }

    .international-block {
      position: static;
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 6px 5px;
      background: #9a9a9a;
      color: #ffffff;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-weight: 300;
      overflow: hidden;
      pointer-events: none;
    }

    .international-block strong {
      display: block;
      font-size: 18px;
      line-height: 0.98;
      font-weight: 300;
    }

    .international-block span {
      display: block;
      font-size: 14px;
      line-height: 1.06;
      font-weight: 300;
    }

    @media (max-width: 1000px) {
      .page {
        padding: 12px;
      }

      .header {
        padding-right: 0;
      }

      .owid-badge {
        position: static;
        display: inline-block;
        margin-bottom: 10px;
      }

      .layout {
        grid-template-columns: 1fr;
        min-height: 1160px;
      }

      .right-side {
        grid-template-rows: 58fr 42fr;
      }

      .right-bottom-wrap {
        margin-bottom: 72px;
      }

      .region-header strong {
        font-size: 22px;
      }

      .region-header span {
        font-size: 15px;
      }

    }
    .owid-badge,
    .subtitle,
    .notes,
    .status {
      display: none !important;
    }

    body.preview-mode {
      background: #ffffff;
      overflow: hidden;
    }

    body.preview-mode .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      margin: 0;
      padding: 6px;
      overflow: hidden;
    }

    body.preview-mode .header,
    body.preview-mode .notes,
    body.preview-mode .status {
      display: none !important;
    }

    body.preview-mode .chart-frame {
      height: 100%;
    }

    body.preview-mode .layout {
      min-height: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    if (new URLSearchParams(window.location.search).get("preview") === "1") {
      document.body.classList.add("preview-mode");
    }
  </script>
  <div class="page">
    <header class="header">
      <div class="owid-badge">Our World<br />in Data</div>
      <h1>Who emits the most CO2?</h1>
      <p id="subtitle" class="subtitle">Global carbon dioxide (CO2) emissions were 35.9 billion tonnes in 2017.</p>
    </header>

    <div class="chart-frame">
      <div class="layout">
        <section class="left-side region-card top">
          <div class="region-header region-asia" id="title-asia"></div>
          <div class="panel" id="panel-asia">
            <div class="chart-box" id="chart-asia"></div>
          </div>
        </section>

        <section class="right-side">
          <div class="right-top">
            <div class="region-card top">
              <div class="region-header region-north-america" id="title-north-america"></div>
              <div class="panel" id="panel-north-america">
                <div class="chart-box" id="chart-north-america"></div>
              </div>
            </div>
            <div class="region-card top">
              <div class="region-header region-europe" id="title-europe"></div>
              <div class="panel" id="panel-europe">
                <div class="chart-box" id="chart-europe"></div>
              </div>
            </div>
          </div>

          <div class="right-bottom-wrap">
            <div class="right-bottom">
              <div class="region-card">
                <div class="panel small" id="panel-africa">
                  <div class="chart-box" id="chart-africa"></div>
                </div>
              </div>
              <div class="region-card">
                <div class="panel small" id="panel-south-america">
                  <div class="chart-box" id="chart-south-america"></div>
                </div>
              </div>
              <div class="region-card">
                <div class="panel small" id="panel-oceania">
                  <div class="chart-box" id="chart-oceania"></div>
                </div>
              </div>
              <div class="region-card international-card">
                <div class="panel small" id="panel-international">
                  <div class="international-block" id="international-block">
                    <strong>International aviation<br />&amp; shipping</strong>
                    <span>1.15 billion tonnes</span>
                    <span>3.2%</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="right-bottom-captions">
              <div class="region-header region-africa" id="title-africa"></div>
              <div class="region-header region-south-america" id="title-south-america"></div>
              <div class="region-header region-oceania" id="title-oceania"></div>
              <div></div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div id="status" class="status"></div>

  </div>

  <script src="./echarts.min.js"></script>
  <script src="./owid_co2_treemap_assets.js"></script>
  <script>
    const subtitleEl = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const internationalBlockEl = document.getElementById("international-block");

    const asset = window.OWID_CO2_TREEMAP || {};
    const pointsByYear = asset.pointsByYear || {};

    const REGION_META = [
      { key: "Asia", chartId: "chart-asia", titleId: "title-asia" },
      { key: "North America", chartId: "chart-north-america", titleId: "title-north-america" },
      { key: "Europe", chartId: "chart-europe", titleId: "title-europe" },
      { key: "Africa", chartId: "chart-africa", titleId: "title-africa" },
      { key: "South America", chartId: "chart-south-america", titleId: "title-south-america" },
      { key: "Oceania", chartId: "chart-oceania", titleId: "title-oceania" }
    ];

    const charts = new Map();
    const STATIC_YEAR = 2017;

    function initCharts() {
      REGION_META.forEach((meta) => {
        const el = document.getElementById(meta.chartId);
        charts.set(meta.key, echarts.init(el, null, { renderer: "canvas" }));
      });
    }

    function getYearData(year) {
      return pointsByYear[String(year)] || pointsByYear[year] || { worldTotal: 0, regions: [] };
    }

    function getRegion(yearData, name) {
      return (yearData.regions || []).find((region) => region.name === name) || null;
    }

    function formatGt(value) {
      if (value >= 1) {
        return `${value.toFixed(1)} billion tonnes CO2`;
      }
      return `${(value * 1000).toFixed(0)} million tonnes CO2`;
    }

    function formatRegionShare(value, worldTotal) {
      if (!worldTotal) return "0% global emissions";
      return `${((value / worldTotal) * 100).toFixed(0)}% global emissions`;
    }

    function formatCountryShare(value, worldTotal) {
      if (!worldTotal) return "0.0%";
      return `${((value / worldTotal) * 100).toFixed(1)}%`;
    }

    function formatPrimaryShare(value, worldTotal) {
      if (!worldTotal) return "0% global emissions";
      const share = (value / worldTotal) * 100;
      return `${share >= 10 ? share.toFixed(0) : share.toFixed(1)}% global emissions`;
    }

    function abbreviateName(name) {
      const fixed = {
        "United States": "USA",
        "European Union (27)": "EU-27",
        "United Arab Emirates": "UAE",
        "South Korea": "S. Korea",
        "Saudi Arabia": "Saudi Arabia",
        "North Korea": "N. Korea",
        "New Zealand": "N. Zealand",
        "International aviation": "Int. aviation",
        "International shipping": "Int. shipping",
        "Trinidad and Tobago": "Trinidad",
        "Dominican Republic": "Dominican Rep.",
        "Bosnia and Herzegovina": "Bosnia",
        "Papua New Guinea": "Papua N.G.",
        "Democratic Republic of Congo": "DR Congo",
        "Equatorial Guinea": "Eq. Guinea",
        "South Africa": "South Africa",
        "Saudi Arabia": "Saudi Arabia",
        "South America": "S. America",
        "North America": "N. America",
        "United Kingdom": "UK",
        "Czechia": "Czechia",
        "Papua New Guinea": "Papua N.G.",
        "Bosnia and Herzegovina": "Bosnia",
        "Hong Kong": "Hong Kong",
        "New Caledonia": "New Cald.",
        "Saint Pierre and Miquelon": "St Pierre",
        "Turks and Caicos Islands": "Turks",
        "Saint Vincent and the Grenadines": "St Vincent",
        "British Virgin Islands": "BVI"
      };
      if (fixed[name]) return fixed[name];
      if (name.length <= 11) return name;
      const words = name.split(/\s+/).filter(Boolean);
      if (words.length >= 2 && words.every((word) => word.length > 0)) {
        const initials = words.map((word) => word[0]).join(".");
        if (initials.length <= 8) return initials + ".";
      }
      return name.slice(0, 10);
    }

    function formatCompactValue(value, includeCo2) {
      if (value >= 1) {
        return `${value.toFixed(1)} billion tonnes${includeCo2 ? " CO2" : ""}`;
      }
      return `${Math.round(value * 1000)}M tonnes${includeCo2 ? " CO2" : ""}`;
    }

    function formatFullValue(value, includeCo2) {
      if (value >= 1) {
        return `${value.toFixed(1)} billion tonnes${includeCo2 ? " CO2" : ""}`;
      }
      return `${Math.round(value * 1000)} million tonnes${includeCo2 ? " CO2" : ""}`;
    }

    function formatLabelValue(value) {
      if (value >= 1) {
        return `${value.toFixed(1)} billion tonnes`;
      }
      return `${(value * 1000).toFixed(0)} million tonnes`;
    }

    function formatShortLabelValue(value) {
      if (value >= 1) {
        return `${value.toFixed(1)} billion tonnes`;
      }
      return `${(value * 1000).toFixed(0)}m tonnes`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    // Tune these values to control country labels inside treemap tiles.
    // Smaller scale values make labels larger; min/max values bound the font sizes.
    const LABEL_SIZE_CONFIG = {
      minTileArea: 850,
      minNarrowSide: 17,
      normalScale: 5.7,
      smallPanelScale: 6.1,
      normalNameMin: 10,
      normalNameMax: 34,
      smallNameMin: 9,
      smallNameMax: 16,
      metaRatio: 0.68,
      normalMetaMin: 8,
      normalMetaMax: 20,
      smallMetaMin: 7,
      smallMetaMax: 12,
      paddingScale: 20
    };

    function buildTileLabel(child, worldTotal, panelWidth, panelHeight, isSmallPanel) {
      if (child.isInternationalBlock) {
        return {
          show: true,
          position: "insideTopLeft",
          align: "left",
          verticalAlign: "top",
          color: "#ffffff",
          fontSize: 18,
          lineHeight: 18,
          fontWeight: 300,
          overflow: "break",
          padding: [6, 0, 0, 6],
          formatter: [
            "{name|International aviation}",
            "{name|& shipping}",
            `{value|${formatGt(child.value || 0).replace(" CO2", "")}}`,
            `{share|${formatCountryShare(child.value || 0, worldTotal)}}`
          ].join("\n"),
          rich: {
            name: {
              fontSize: 18,
              lineHeight: 18,
              fontWeight: 300,
              color: "#ffffff"
            },
            value: {
              fontSize: 14,
              lineHeight: 15,
              fontWeight: 300,
              color: "#ffffff"
            },
            share: {
              fontSize: 14,
              lineHeight: 15,
              fontWeight: 300,
              color: "#ffffff"
            }
          }
        };
      }

      const shareOfRegion = child.shareOfRegion || 0;
      const tileArea = Math.max(shareOfRegion * panelWidth * panelHeight, 0);
      const tileSide = Math.sqrt(tileArea);
      const narrowSide = Math.max(Math.min(panelWidth, panelHeight) * Math.sqrt(shareOfRegion) * 0.72, 0);

      if (tileArea < LABEL_SIZE_CONFIG.minTileArea || narrowSide < LABEL_SIZE_CONFIG.minNarrowSide) {
        return { show: false };
      }

      const shortName = abbreviateName(child.name || "");
      const useFullName = narrowSide >= 78 || shortName === child.name;
      const nameText = useFullName ? child.name : shortName;
      const amount = tileArea >= 9000 ? formatLabelValue(child.value || 0) : formatShortLabelValue(child.value || 0);
      const share = formatCountryShare(child.value || 0, worldTotal);
      const scale = isSmallPanel ? LABEL_SIZE_CONFIG.smallPanelScale : LABEL_SIZE_CONFIG.normalScale;
      const nameFont = clamp(
        Math.round(Math.sqrt(tileArea) / scale),
        isSmallPanel ? LABEL_SIZE_CONFIG.smallNameMin : LABEL_SIZE_CONFIG.normalNameMin,
        isSmallPanel ? LABEL_SIZE_CONFIG.smallNameMax : LABEL_SIZE_CONFIG.normalNameMax
      );
      const metaFont = clamp(
        Math.round(nameFont * LABEL_SIZE_CONFIG.metaRatio),
        isSmallPanel ? LABEL_SIZE_CONFIG.smallMetaMin : LABEL_SIZE_CONFIG.normalMetaMin,
        isSmallPanel ? LABEL_SIZE_CONFIG.smallMetaMax : LABEL_SIZE_CONFIG.normalMetaMax
      );
      const topPad = clamp(Math.round(tileSide / LABEL_SIZE_CONFIG.paddingScale), 4, 14);
      const leftPad = clamp(Math.round(tileSide / LABEL_SIZE_CONFIG.paddingScale), 4, 14);

      let formatter = `{name|${nameText}}`;
      if (tileArea >= 2600 && narrowSide >= 34) {
        formatter += `\n{share|${share}}`;
      }
      if (tileArea >= 4200 && narrowSide >= 42) {
        formatter = `{name|${nameText}}\n{value|${amount}}\n{share|${share}}`;
      }

      return {
        show: true,
        position: "insideTopLeft",
        align: "left",
        verticalAlign: "top",
        color: "#ffffff",
        fontSize: nameFont,
        lineHeight: nameFont + 2,
        fontWeight: 500,
        overflow: "truncate",
        padding: [topPad, 0, 0, leftPad],
        rich: {
          name: {
            fontSize: nameFont,
            lineHeight: nameFont + 2,
            fontWeight: 500,
            color: "#ffffff"
          },
          value: {
            fontSize: metaFont,
            lineHeight: metaFont + 2,
            fontWeight: 300,
            color: "#ffffff"
          },
          share: {
            fontSize: metaFont,
            lineHeight: metaFont + 2,
            fontWeight: 300,
            color: "#ffffff"
          }
        },
        formatter
      };
    }

    function setPanelTitle(regionName, region, worldTotal) {
      const meta = REGION_META.find((item) => item.key === regionName);
      const titleEl = document.getElementById(meta.titleId);
      if (!region) {
        titleEl.innerHTML = "";
        return;
      }
      titleEl.innerHTML = [
        `<strong>${regionName}</strong>`,
        `<span>${formatGt(region.value || 0)}</span>`,
        `<span>${formatRegionShare(region.value || 0, worldTotal)}</span>`
      ].join("");
    }

    function buildTreemapOption(region, worldTotal, isSmallPanel, chartEl) {
      const panelWidth = chartEl ? Math.max(chartEl.clientWidth || 0, 1) : 1;
      const panelHeight = chartEl ? Math.max(chartEl.clientHeight || 0, 1) : 1;
      const sourceChildren = region.children || [];
      const children = sourceChildren
        .filter((child) => child.value != null && child.value > 0)
        .sort((a, b) => (b.value || 0) - (a.value || 0))
        .map((child, index) => {
          const mapped = {
            name: child.name,
            value: child.value,
            isPrimary: index === 0,
            isInternationalBlock: !!child.isInternationalBlock,
            shareOfRegion: region.value ? (child.value || 0) / region.value : 0,
            itemStyle: child.itemStyle || region.itemStyle
          };
          mapped.label = buildTileLabel(mapped, worldTotal, panelWidth, panelHeight, isSmallPanel);
          return mapped;
        });

      return {
        animation: true,
        backgroundColor: "transparent",
        tooltip: {
          show: true,
          trigger: "item",
          backgroundColor: "rgba(255,255,255,0.98)",
          borderColor: "#d7d1c6",
          borderWidth: 1,
          textStyle: {
            color: "#38506e",
            fontFamily: '"Trebuchet MS", "Segoe UI", sans-serif',
            fontSize: 13
          },
          formatter(params) {
            const data = params.data || {};
            if (!data.name) return "";
            return [
              `<strong>${data.name}</strong>`,
              formatGt(data.value || 0),
              `${formatCountryShare(data.value || 0, worldTotal)} of global emissions`
            ].join("<br/>");
          }
        },
        series: [
          {
            type: "treemap",
            roam: false,
            nodeClick: false,
            breadcrumb: { show: false },
            sort: "desc",
            squareRatio: 1,
            visibleMin: 0,
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            data: children,
            label: {
              show: false,
              position: "insideTopLeft",
              align: "left",
              verticalAlign: "top",
              color: "#ffffff",
              fontFamily: '"Trebuchet MS", "Segoe UI", sans-serif',
              fontSize: isSmallPanel ? 8 : 10,
              lineHeight: isSmallPanel ? 10 : 13,
              overflow: "truncate",
              padding: [6, 0, 0, 6],
              formatter() {
                return "";
              }
            },
            upperLabel: {
              show: false
            },
            emphasis: {
              disabled: true
            },
            itemStyle: {
              borderColor: "rgba(255,255,255,0.9)",
              borderWidth: 1,
              gapWidth: 1
            },
            levels: [
              {
                itemStyle: {
                  borderColor: "rgba(255,255,255,0.9)",
                  borderWidth: 1,
                  gapWidth: 1
                }
              }
            ]
          }
        ]
      };
    }

    function renderStaticYear() {
      const yearData = getYearData(STATIC_YEAR);
      const worldTotal = yearData.worldTotal || 0;
      subtitleEl.textContent = `Global carbon dioxide (CO2) emissions were ${worldTotal.toFixed(1)} billion tonnes in ${STATIC_YEAR}.`;
      if (statusEl) {
        statusEl.textContent = `Static treemap using ${STATIC_YEAR} data. Global emissions: ${worldTotal.toFixed(1)} billion tonnes CO2.`;
      }

      REGION_META.forEach((meta) => {
        const region = getRegion(yearData, meta.key);
        const chart = charts.get(meta.key);
        const chartEl = document.getElementById(meta.chartId);
        const isSmall = ["Africa", "South America", "Oceania"].includes(meta.key);
        setPanelTitle(meta.key, region, worldTotal);

        if (!region || !chart) return;
        chart.setOption(buildTreemapOption(region, worldTotal, isSmall, chartEl), true);
      });
    }

    function resizeAll() {
      charts.forEach((chart) => chart.resize());
    }

    function rerenderAndResize() {
      resizeAll();
      renderStaticYear();
      resizeAll();
    }

    function init() {
      try {
        if (!window.echarts) {
          throw new Error("Local echarts.min.js was not loaded.");
        }
        initCharts();
        rerenderAndResize();
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Chart assets failed to load. Please keep echarts.min.js and owid_co2_treemap_assets.js in the same folder as this HTML file.";
      }
    }

    window.addEventListener("resize", rerenderAndResize);

    init();
  </script>
</body>
</html>
